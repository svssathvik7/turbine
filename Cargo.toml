[package]
name = "turbine-rpc-proxy"
version = "1.0.0"
edition = "2021"
description = "Multi-chain RPC proxy with intelligent endpoint rotation"
license = "MIT"
repository = "https://github.com/svssathvik7/turbine"
keywords = ["rpc", "json-rpc", "proxy", "blockchain", "ethereum"]
categories = ["network-programming", "web-programming::http-server", "web-programming::websocket", "caching", "authentication"]
readme = "README.md"
documentation = "https://docs.rs/turbine-rpc-proxy"

[lib]
name = "turbine"
path = "src/lib.rs"

[[bin]]
name = "turbine"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
bytes = "1"
moka = { version = "0.12", features = ["future"] }
governor = "0.8"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
base64 = "0.22"
