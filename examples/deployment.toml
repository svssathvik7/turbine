# Turbine deployment config — multi-chain production example
# Mount to /etc/turbine/config.toml in Docker
#
# Replace placeholder URLs with your actual RPC endpoints.

[server]
host = "0.0.0.0"
port = 8080

# ─── Ethereum Mainnet (chainId: 1) ───
# Weighted rotation: primary provider gets 100x traffic vs others
[[chains]]
name = "ethereum"
route = "/ethereum"
chain_id = 1
rotation = "weighted"
endpoints = [
    { url = "https://eth-mainnet.g.alchemy.com/v2/YOUR_API_KEY_1", weight = 100 },
    { url = "https://eth-mainnet.g.alchemy.com/v2/YOUR_API_KEY_2", weight = 1 },
    { url = "https://eth-mainnet.g.alchemy.com/v2/YOUR_API_KEY_3", weight = 1 },
    { url = "https://rpc.ankr.com/eth/YOUR_ANKR_KEY", weight = 1 },
    { url = "https://lb.drpc.live/ethereum/YOUR_DRPC_KEY", weight = 1 },
]

[chains.health]
max_consecutive_failures = 3
cooldown_seconds = 30
health_check_interval_seconds = 30
max_block_lag = 10
max_retries = 4
retry_delay_ms = 0

[chains.rate_limit]
max_requests = 50
window_seconds = 1

[chains.hedge]
delay_ms = 500
max_count = 1

[chains.cache]
enabled = true
preset = "evm"

