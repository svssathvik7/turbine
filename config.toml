[server]
host = "127.0.0.1"
port = 8080
# dashboard_secret = "my-secret-path"  # dashboard at /{secret}, disabled if omitted

# Round-robin (default) with simple string endpoints
[[chains]]
name = "ethereum"
route = "/ethereum"
chain_id = 1                  # enables routing via POST /1
endpoints = [
    "https://eth.llamarpc.com",
    "https://rpc.ankr.com/eth",
    "https://ethereum-rpc.publicnode.com",
]

[chains.health]
max_consecutive_failures = 3
cooldown_seconds = 30
# health_method defaults to "eth_blockNumber" for EVM chains
health_check_interval_seconds = 30
max_block_lag = 10
# max_retries = 1             # retry count (default: 1)
# retry_delay_ms = 0          # delay between retries (default: 0)

# [chains.rate_limit]
# max_requests = 100
# window_seconds = 60

# [chains.hedge]
# delay_ms = 500              # fire hedge after 500ms with no response
# max_count = 1               # max 1 additional parallel request

# Method routing: route specific methods to designated endpoints
# [[chains.endpoints]]
# url = "https://private-mempool-rpc.example.com"
# methods = ["eth_sendRawTransaction"]   # only receives this method
#
# [[chains.endpoints]]
# url = "https://public-rpc.example.com"
# (no methods field = handles everything except claimed methods)

# Weighted rotation with explicit weights
[[chains]]
name = "solana"
route = "/solana"
rotation = "weighted"
endpoints = [
    { url = "https://api.mainnet-beta.solana.com", weight = 3 },
    { url = "https://rpc.ankr.com/solana", weight = 1 },
]

[chains.health]
max_consecutive_failures = 5
cooldown_seconds = 60
health_method = "getSlot"
health_check_interval_seconds = 15
max_block_lag = 50

# WebSocket support: clients connect via WS to any chain route (GET /{chain})
# WSS URLs are auto-derived from HTTPS endpoints (https→wss, http→ws)
# Or set explicitly:
# [[chains.endpoints]]
# url = "https://rpc.example.com"
# ws_url = "wss://ws.example.com"   # explicit WS URL (optional)

# Latency-based rotation: routes more traffic to faster endpoints
# [[chains]]
# name = "polygon"
# route = "/polygon"
# rotation = "latency"
# endpoints = [
#     { url = "https://polygon-rpc.com", weight = 1 },
#     { url = "https://rpc.ankr.com/polygon", weight = 1 },
# ]
#
# [chains.health]
# max_consecutive_failures = 3
# cooldown_seconds = 30
