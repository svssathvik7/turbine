rateLimiters:
  budgets:
    - id: high
      rules:
        - method: "*"
          maxCount: 100
          period: 1s

database:
  evmJsonRpcCache:
    connectors:
      - id: memory-cache
        driver: memory
        memory:
          maxItems: 50000
    policies:
      - network: "*"
        method: "*"
        finality: finalized
        connector: memory-cache
        ttl: 86400s
        maxItemSize: 512KB
      - network: "*"
        method: "*"
        finality: unfinalized
        connector: memory-cache
        ttl: 2s
        maxItemSize: 256KB
      - network: "*"
        method: "*"
        finality: unknown
        connector: memory-cache
        ttl: 5s
        maxItemSize: 256KB
