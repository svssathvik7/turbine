[server]
host = "0.0.0.0"
port = 8081
dashboard_secret = "hashira-dashboard"

# ─── Ethereum Sepolia (chainId: 11155111) ───
[[chains]]
name = "ethereum_sepolia"
route = "/ethereum_sepolia"
chain_id = 11155111
rotation = "latency"
endpoints = [
  "https://ethereum-sepolia-rpc.publicnode.com",
  "https://rpc.sepolia.org",
  "https://rpc2.sepolia.org",
  "https://rpc.sepolia.ethpandaops.io",
  "https://eth-sepolia.public.blastapi.io",
  "https://1rpc.io/sepolia",
  "https://sepolia.gateway.tenderly.co",
  "https://gateway.tenderly.co/public/sepolia",
  "https://endpoints.omniatech.io/v1/eth/sepolia/public",
  "https://sepolia.drpc.org",
  "https://eth-sepolia-public.unifra.io",
  "https://eth-sepolia.api.onfinality.io/public",
  "https://public.stackup.sh/api/v1/node/ethereum-sepolia",
  "https://ethereum-sepolia-public.nodies.app",
  "https://api.zan.top/eth-sepolia",
  "https://rpc.notadegen.com/eth/sepolia",
  "https://ethereum-sepolia.blockpi.network/v1/rpc/public",
  "https://ethereum-subquery.network/public",
  "https://0xrpc.io/sep",
  "https://ethereum-sepolia.therpc.io",
  "https://ethereum-sepolia.gateway.tatum.io",
  "https://rpc.sentio.xyz/sepolia",
  "https://eth-sepolia.g.alchemy.com/v2/demo",
]

[chains.health]
max_consecutive_failures = 2
cooldown_seconds = 60
health_check_interval_seconds = 300
max_block_lag = 10
max_retries = 10
retry_delay_ms = 0

[chains.rate_limit]
max_requests = 100
window_seconds = 1

[chains.hedge]
delay_ms = 100
max_count = 3

[chains.cache]
enabled = true
preset = "evm"
max_capacity = 50000

